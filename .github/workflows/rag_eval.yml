name: LLM & RAG Quality Gate Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rag-evaluation:
    name: RAG Evaluation & Quality Gate Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-xdist httpx pydantic rich

      - name: Run Synthetic Golden Dataset Validation
        run: |
          python synthesizer_local.py --doc tests/sample_requirements/amazon_20_requirements.md --output test_rag_data.json --max-items 5

      - name: Execute RAG Quality Gate Pytest Suite
        env:
          LLM_PROVIDER: ollama
          OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
        run: |
          pytest -v -n auto tests/test_rag_pipeline.py

      - name: Upload RAG Evaluation Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: output/artifacts/reports/
